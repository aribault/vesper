[project]
name = "vesper"
version = "0.1.0"
description = "A hands-on exploration of autoregressive language models from first principles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
python-preference = "only-system"
python-downloads = "manual"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]